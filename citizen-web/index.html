<!doctype html>
<!-- Setu citizen chat widget (design D4, tasks 3.1-3.3/3.5/3.8).
     Static, framework-free, served by FastAPI StaticFiles at /citizen.
     Bilingual chrome: Hindi (Devanagari, Noto Sans Devanagari) primary,
     smaller English subtitles. Citizen register per files/07: warm accent,
     16px radii, >=44px touch targets. NO PII inputs anywhere. -->
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>सेतु — Setu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-mark" aria-hidden="true">सेतु</div>
      <div class="header-text">
        <div class="hi">अपनी समस्या बताइए</div>
        <div class="en">Tell us about your problem</div>
      </div>
    </header>

    <main id="chat" class="chat" aria-live="polite"></main>

    <footer class="composer">
      <label class="visually-hidden" for="text-input">
        अपनी समस्या लिखिए / Type your problem
      </label>
      <input id="text-input" class="text-input" type="text" autocomplete="off"
             enterkeyhint="send"
             placeholder="यहाँ लिखिए… / Type here…" />
      <button id="send-btn" class="send-btn" type="button"
              aria-label="भेजें / Send">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <path d="M22 2 11 13" /><path d="M22 2 15 22 11 13 2 9z" />
        </svg>
      </button>
      <button id="mic-btn" class="mic-btn" type="button"
              aria-label="दबाकर रखें और बोलें / Press and hold to speak">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z" />
          <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
          <line x1="12" y1="19" x2="12" y2="22" />
        </svg>
      </button>
    </footer>
    <div class="mic-hint">
      <span class="hi">बोलने के लिए माइक दबाकर रखें</span>
      <span class="en">Press and hold the mic to speak</span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
